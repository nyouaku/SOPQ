# Logging default untuk semua service: rotasi supaya log tidak memenuhi disk (4.8).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER wajib diisi di .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}
      POSTGRES_DB: ${DB_NAME:-stockopname_db}
    # Tidak ada mapping host: Postgres hanya diakses backend lewat jaringan compose.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Tidak ada mapping host: Redis hanya diakses backend lewat jaringan compose.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    # Shutdown backend 30 detik (cmd/api/main.go). Docker default cuma 10 detik
    # sebelum SIGKILL, jadi beri ruang lebih.
    stop_grace_period: 35s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Tidak ada `ports:`: backend hanya diakses nginx lewat jaringan compose.
    # Backend tidak expose port langsung ke host (hanya lewat nginx).
    # Di dalam compose, backend tetap 8080.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    logging: *default-logging

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    # Tidak ada `ports:`: dashboard hanya diakses nginx.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
    logging: *default-logging

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    ports:
      # Default: semua interface di port 80 supaya HP di LAN bisa akses.
      # Di VPS yang port 80-nya sudah dipakai app lain, set:
      #   NGINX_BIND=127.0.0.1  NGINX_PORT=8088
      # lalu host reverse-proxy ke 127.0.0.1:8088.
      - "${NGINX_BIND:-0.0.0.0}:${NGINX_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }
    logging: *default-logging

volumes:
  pgdata:

# ===== FILE: mobile/pubspec.yaml =====
name: stock_opname_mobile
description: Stock Opname Mobile App with QRCode and Voice Input
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # HTTP & Network
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # Local Database
  sqflite: ^2.3.0
  path: ^1.8.3

  # QR Code Scanner
  mobile_scanner: ^3.5.5

  # Speech Recognition & TTS
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.5
  permission_handler: ^11.1.0

  # Connectivity Check
  connectivity_plus: ^5.0.2

  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # Utils
  intl: ^0.18.1
  uuid: ^4.3.3
  logger: ^2.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.7
  riverpod_lint: ^2.3.7

flutter:
  uses-material-design: true

  # assets:
  #   - images/
  #   - sounds/

# ===== END FILE =====
